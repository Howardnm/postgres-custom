version: '3.8'

services:
  db:
    image: howardnm/postgres-custom:latest
    container_name: postgres-custom-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=your_super_secret_password # 请务必修改为强密码
      - POSTGRES_DB=mydatabase
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - postgres-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: postgres-custom-pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com # pgAdmin 登录邮箱
      - PGADMIN_DEFAULT_PASSWORD=your_admin_password # pgAdmin 登录密码
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - postgres-net

volumes:
  pg_data:
  pgadmin_data:

networks:
  postgres-net:
    driver: bridge
